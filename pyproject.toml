[build-system]
requires=["setuptools>=68", "wheel"]
build-backend="setuptools.build_meta"

[project]
name="mindrec"
version="0.1.0"
description="MIND multi-stage recommender: retrieval + DLRM ranker + reranking with distillation, diversity, fairness"
requires-python=">=3.10"
dependencies=[
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.6",
    "matplotlib>=3.8",
]

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]
