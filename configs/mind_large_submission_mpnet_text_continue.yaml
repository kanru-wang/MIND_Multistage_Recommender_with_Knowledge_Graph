extends: "mind_large_temporal_mpnet.yaml"

# Continue only the Phase 1-selected MPNet encoder on the held-out temporal
# validation behaviours. This is the same maximum-data protocol used by the
# proven MiniLM submission pipeline; the hidden test set remains untouched.
run_name: "mind_large_submission_mpnet_v1"

teacher:
  text_adaptation:
    initial_model_from_run: "mind_large_temporal_mpnet_candidate_attention_v1"
    expected_initial_update: 9000
    training_split: "val"
    max_optimizer_updates: 2000
    early_stopping:
      enabled: false
