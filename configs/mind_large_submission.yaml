run_name: "mind_large_submission_hard_neg_v4"

data:
  raw_root: "data/raw"
  dataset_name: "MINDlarge_submission"
  mode: "leaderboard_submission"
  train_dir: "MINDlarge_train"
  dev_dir: "MINDlarge_dev"
  test_dir: "MINDlarge_test"
  processed_root: "data/processed"
  max_history: 50
  min_user_hist_for_warm: 5
  min_item_train_clicks_for_warm: 10
  ranker_negatives_per_positive: 4
  sub_sample:
    enabled: false
    train_impressions: 200000
    dev_impressions: 50000
    seed: 13

knowledge_graph:
  enabled: true
  entity_embedding_path: null
  relation_embedding_path: null
  triples_path: "data/processed/MINDlarge/kg_triples.tsv"
  max_entities_per_news: 12
  max_neighbors_per_entity: 20
  add_reverse_edges: true
  entity_weight: 1.0
  neighbor_weight: 0.1
  relation_weight: 0.1
  text_feature_weight: 1.0
  kg_feature_weight: 0.25
  normalize_item_base: true
  normalize: true

teacher:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  text:
    include_category_prefix: false
  batch_size: 128
  user_attn_heads: 4
  user_attn_dim: 384
  lr: 2.0e-4
  epochs: 4
  early_stopping:
    enabled: false
    patience: 2
    monitor: "retrieval_recall@k"
    min_delta: 1.0e-4
  temperature: 0.05
  negatives_per_positive: 8
  device: "cuda"

retrieval:
  index_type: "flat_ip"
  base_index_type: "flat_ip"
  hybrid_base_weight: 0.075
  hybrid_oversample: 26
  sweep:
    hybrid_base_weights: [0.05, 0.0625, 0.075]
    hybrid_oversamples: [18, 22, 26]
  ivf_nlist: 2048
  topk: 200

ranker:
  batch_size: 1024
  lr: 3.25e-4
  weight_decay: 1e-5
  epochs: 1
  early_stopping:
    enabled: false
    patience: 2
    min_delta: 1.0e-5
  device: "cuda"
  hard_negative_sampling:
    enabled: true
    pool_size: 20
    hard_fraction: 0.25
    score_batch_size: 512
    teacher_consistent_hard_only: true
    max_score_above_positive: 0.0
    hard_for_cold_users_only: true
    hard_negative_distill_weight: 0.0
  dlrm:
    emb_dim: 56
    id_emb_dim: 8
    news_id_warm_scale: 1.0
    news_id_cold_scale: 0.0
    semantic_ff_mult: 3
    semantic_dropout: 0.20
    bottom_mlp: [64, 56]
    top_mlp: [128, 64, 1]
    dropout: 0.15
  distill:
    temperature: 2.0
    lambda_logit: 0.7
    lambda_repr: 0.05
    cold_weight: 2.0
    warm_weight: 0.5
  calibration:
    enabled: false
    lr: 0.05
    max_iter: 100

rerank:
  k_out: 10
  pool_size: 50
  position_bias: "log"
  relevance_weight: 0.875
  novelty_weight: 0.05
  coverage_weight: 0.075
  novelty_sim: "teacher_cosine"
  coverage:
    max_new_entities_per_item: 3
    category_bonus: 1.0
    entity_bonus: 0.3
  fairness:
    enabled: true
    category_target: "catalog"
    new_item_floor: 0.20
    penalty_weight: 0.25
  search:
    relative_guardrails:
      max_ndcg_drop_ratio: 0.021
      min_new_item_exposure_gain: 0.00
      min_category_coverage_gain: 0.25
      min_fairness_kl_pool_improvement: 0.04
    utility_coefficients:
      ndcg_retention_units: 4.0
      new_item_exposure_gain_units: 0.5
      category_coverage_gain_units: 1.5
      fairness_kl_pool_improvement_units: 1.5

eval:
  report_splits: []
  ks: [5, 10]
  time_periods: 4

submission:
  split_name: "submission_test"
  batch_size: 8192
  candidate_buffer_size: 65536
  exact_rank_guard_threshold: 1.0e-5
  reference_batch_size: 2048
