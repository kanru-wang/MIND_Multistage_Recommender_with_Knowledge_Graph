run_name: "mind_large_ensemble_two_mixed_loss_v1"

data:
  processed_root: "data/processed"
  dataset_name: "MINDlarge_temporal_tune"

posthoc_recency:
  enabled: true
  age_dataset_name: "MINDlarge_submission"
  alpha: 0.02
  max_age_hours: 720.0

# Separate temporal-only command: no hidden-test ZIPs or writable champion paths.
two_model_ensemble:
  baseline_config: "configs/mind_large_ensemble_mpnet_p1_minilm.yaml"
  tune_date: "2019-11-14"
  report_date: "2019-11-15"

ensemble:
  members:
    - name: "mpnet_bce_pairwise_w025"
      config: "configs/mind_large_temporal_mpnet_p1_dual_pairwise.yaml"
    - name: "minilm_bce_pairwise_w025"
      config: "configs/mind_large_temporal_minilm_dual_pairwise.yaml"
  primary_weight_grid: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.0]
  tune_split: "rerank_tune"
  report_split: "rerank_test"
  device: "cuda"
  batch_size: 2048
  candidate_buffer_size: 65536
  item_encoding_batch_size: 8192
  exact_rank_guard_threshold: 1.0e-5
  reference_batch_size: 2048
