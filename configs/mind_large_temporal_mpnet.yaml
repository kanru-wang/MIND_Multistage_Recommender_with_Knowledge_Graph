extends: "mind_large_temporal_text_adapt.yaml"

# Controlled backbone experiment: keep the proven temporal data, adaptation
# objective, negative policy, teacher, and candidate-aware ranker fixed while
# replacing only MiniLM with the stronger 768-dimensional MPNet encoder.
run_name: "mind_large_temporal_mpnet_candidate_attention_v1"

teacher:
  model_name: "sentence-transformers/all-mpnet-base-v2"
  # Text encoding is separate from the unchanged teacher-training batch size.
  encode_batch_size: 64
  text_adaptation:
    # Preserve MiniLM's exact logical and physical training-batch schedule.
    batch_size: 16
    gradient_accumulation_steps: 4
    # Permit only the initial backbone load to populate the Hugging Face cache.
    local_files_only: false
    # Reduce activation memory without changing batch membership or the loss.
    gradient_checkpointing: true
    mixed_precision: "fp16"
    # Chunk only article encoding inside each logical batch of 16 users. The
    # contrastive loss still sees all 16 users and the original in-batch set.
    encoder_forward_batch_size: 8
    encode_batch_size: 64

ranker:
  dlrm:
    history_pooling: "candidate_attention"
    candidate_attention_heads: 4
    candidate_attention_dropout: 0.0

rerank:
  # Highest full-tuning nDCG subject to aggregate guardrails.
  # Search, selected parameters, and reporting use this single config.
  output_subdir: "rerank"
  # Highest full-tuning nDCG among candidates satisfying every fixed guardrail.
  relevance_weight: 0.95
  novelty_weight: 0.025
  coverage_weight: 0.025
  fairness:
    penalty_weight: 0.05
    new_item_floor: 0.40
  selection:
    require_frozen_for_eval: true
    require_distinct_splits: true
    require_provenance_for_eval: true
    source_split: "rerank_tune"
    reporting_split: "rerank_test"
    search_artifact: "runs/mind_large_temporal_mpnet_candidate_attention_v1/rerank/rerank_search.json"
    decision_note: "docs/reranking.md#selected-setting-and-results"
    reporting_note: "November 15 was reused while refining the requirements; these are follow-up results, not an independent test."
    frozen: true  # Selected on Nov 14; evaluation verifies the saved selection.
  search:
    # Evaluate all 18 combinations on the full tuning split.
    shortlist_size: 18
    weight_pairs:
      - [0.00, 0.025]
      - [0.025, 0.025]
      - [0.05, 0.025]
    fairness_penalties: [0.05, 0.075, 0.10]
    new_item_floors: [0.30, 0.40]
    relative_guardrails:
      max_ndcg_drop_ratio: 0.02
      min_new_item_exposure_gain: 0.00
      min_category_coverage_gain: 0.25
      min_fairness_kl_pool_improvement: 0.03
    # Inherit seed=13, sample_size=5000, and teacher_cosine novelty.

eval:
  batch_size: 2048
  item_encoding_batch_size: 8192
